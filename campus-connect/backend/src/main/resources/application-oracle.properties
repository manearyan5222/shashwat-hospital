# =============================================================================
# Profile: oracle (Documented Alternative Database Profile)
# Enterprise Oracle 19c / 21c / 23ai Compatibility Configuration
# Activate via: --spring.profiles.active=oracle or SPRING_PROFILES_ACTIVE=oracle
# =============================================================================
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE_NAME:FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:c##campus_user}
spring.datasource.password=${ORACLE_PASSWORD:oracle_password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
