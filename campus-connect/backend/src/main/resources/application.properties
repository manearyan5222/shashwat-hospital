# =============================================================================
# CampusConnect - Spring Boot Master Configuration
# =============================================================================
spring.application.name=CampusConnect

# Active Profiles:
# 'mysql'  -> Primary database (default)
# 'h2'     -> Zero-config in-memory database for testing and offline development
# 'oracle' -> Documented enterprise Oracle Database profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2,mysql-fallback}

# Embedded Tomcat Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# JWT Configuration
campusconnect.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
campusconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Restricted strictly to deployed frontend origins)
campusconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,https://*.tmp.now,http://localhost:5173,http://localhost:3000}

# Demo Passwords (Configurable securely via Environment Variables)
campusconnect.demo.admin-password=${APP_ADMIN_PASSWORD:Admin@Campus2026!}
campusconnect.demo.faculty-password=${APP_FACULTY_PASSWORD:Faculty@Campus2026!}
campusconnect.demo.student-password=${APP_STUDENT_PASSWORD:Student@Campus2026!}

# Logging Configuration
logging.level.com.campusconnect=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
