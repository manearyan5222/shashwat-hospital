# fly.toml app configuration file generated for campusconnect-backend
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "campusconnect-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "h2"
  CORS_ALLOWED_ORIGINS = "https://*.vercel.app,https://*.tmp.now"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
