version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: campusconnect-mysql
    restart: always
    environment:
      MYSQL_DATABASE: campus_connect
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/mysql-seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: campus_connect
      DB_USERNAME: root
      DB_PASSWORD: root_password
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  legacy-web:
    build:
      context: ./legacy-web
      dockerfile: Dockerfile
    container_name: campusconnect-legacy-web
    restart: always
    ports:
      - "8085:8085"

volumes:
  mysql-data:
